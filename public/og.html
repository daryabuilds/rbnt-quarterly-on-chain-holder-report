<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>RBNT Holder Report Card</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --brand: #EF5350; --steel: #1d3140; --ink: #f1f5f8; --ink2: #c2ced6; --muted: #8fa1ad; --edge: #263641; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: var(--steel); color: var(--ink); font-family: "Be Vietnam Pro", system-ui, sans-serif; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(143,161,173,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(143,161,173,0.07) 1px, transparent 1px); background-size: 48px 48px; }
  .inner { position: absolute; inset: 60px 64px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { height: 58px; }
  .tag { font-size: 16px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 12px; }
  .tag::before { content: ""; width: 32px; height: 3px; background: var(--brand); border-radius: 2px; }
  h1 { font-size: 60px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 700; margin-top: 40px; max-width: 900px; }
  h1 span { color: #ffb3ae; }
  .nums { display: flex; gap: 20px; margin-top: auto; }
  .n { flex: 1; background: rgba(12,19,23,0.55); border: 1px solid var(--edge); border-radius: 8px; padding: 18px 20px; }
  .n b { display: block; font-size: 36px; font-weight: 700; }
  .n span { display: block; font-size: 16px; color: var(--ink2); margin-top: 4px; }
  .foot { display: flex; justify-content: space-between; margin-top: 18px; font-size: 15px; color: var(--muted); }
  .foot .mono { font-family: "JetBrains Mono", monospace; font-weight: 500; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="inner">
  <div class="top">
    <div class="tag">Quarterly on-chain holder report</div>
    <img src="assets/img/redbelly-holder-on-dark.svg" alt="Redbelly Holder">
  </div>
  <h1>How RBNT holders moved in <span id="q">Q3 2026</span></h1>
  <div class="nums" id="nums"></div>
  <div class="foot"><span>1 July to 30 September 2026, read from Redbelly mainnet</span><span class="mono" id="verified"></span></div>
</div>
<script src="data/report.js"></script>
<script>
  (function () {
    var R = window.REPORT, L = R.meta.snapshots.length - 1;
    function full(v) { return Number(v).toLocaleString("en-US"); }
    function m(v) { return (v / 1e6).toFixed(1) + "M"; }
    var items = [
      [full(R.holders.ge1[L]), "holders with 1 RBNT or more"],
      [m(R.staking.total_staked[L]) + " RBNT", "staked in Reddex pools"],
      [(R.concentration.top10[L] * 100).toFixed(1) + "%", "held by the largest 10, outside named wallets"]
    ];
    var box = document.getElementById("nums");
    items.forEach(function (it) {
      var d = document.createElement("div"); d.className = "n";
      var b = document.createElement("b"); b.textContent = it[0];
      var s = document.createElement("span"); s.textContent = it[1];
      d.appendChild(b); d.appendChild(s); box.appendChild(d);
    });
    document.getElementById("q").textContent = R.meta.quarter.label;
    document.getElementById("verified").textContent = "Last verified " + R.meta.generated_utc.slice(0, 10);
  })();
</script>
</body>
</html>
